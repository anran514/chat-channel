<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>躲避生存</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        .info {
            color: #fff;
            font-size: 18px;
            margin-bottom: 10px;
            text-align: center;
        }
        #gameCanvas {
            width: 92vw;
            max-width: 500px;
            height: 80vh;
            max-height: 700px;
            background: #1e293b;
            border-radius: 16px;
            touch-action: none;
            box-shadow: 0 0 30px #22d3ee44;
        }
        .tip {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="info">分数：<span id="score">0</span> &nbsp; 最高分：<span id="best">0</span></div>
    <canvas id="gameCanvas"></canvas>
    <div class="tip">电脑鼠标拖动 / 手机手指滑动 操控小球躲避障碍物</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDom = document.getElementById('score');
        const bestDom = document.getElementById('best');

        // 适配画布尺寸
        function resizeCanvas() {
            const style = getComputedStyle(canvas);
            canvas.width = parseInt(style.width);
            canvas.height = parseInt(style.height);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 游戏数据
        let score = 0;
        let best = localStorage.getItem('dodgeBest') || 0;
        let gameOver = false;
        let player = {};
        let enemies = [];
        let spawnTimer = null;
        let speedRate = 1;

        bestDom.innerText = best;

        // 初始化玩家
        function initPlayer() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.r = 18;
        }

        // 生成敌人
        function spawnEnemy() {
            if(gameOver) return;
            const r = 12 + Math.random() * 18;
            let x, y, vx, vy;
            const side = Math.floor(Math.random() * 4);
            const spd = (1.5 + Math.random() * 2) * speedRate;

            if(side === 0) {x = Math.random()*canvas.width; y = -r; vx = (Math.random()-0.5)*spd; vy = spd;}
            if(side === 1) {x = canvas.width + r; y = Math.random()*canvas.height; vx = -spd; vy = (Math.random()-0.5)*spd;}
            if(side === 2) {x = Math.random()*canvas.width; y = canvas.height + r; vx = (Math.random()-0.5)*spd; vy = -spd;}
            if(side === 3) {x = -r; y = Math.random()*canvas.height; vx = spd; vy = (Math.random()-0.5)*spd;}

            enemies.push({x,y,r,vx,vy,color:`hsl(${Math.random()*360},70%,60%)`});
        }

        // 碰撞检测
        function checkCollision(a,b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.sqrt(dx*dx+dy*dy);
            return dist < a.r + b.r;
        }

        // 绘制
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);

            // 玩家
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fillStyle = '#22d3ee';
            ctx.fill();

            // 敌人
            enemies.forEach(e=>{
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
                ctx.fillStyle = e.color;
                ctx.fill();
            });
        }

        // 更新
        function update() {
            if(gameOver) return;
            score++;
            scoreDom.innerText = score;

            // 难度递增
            if(score % 80 === 0) speedRate += 0.15;

            // 移动敌人
            for(let i=enemies.length-1;i>=0;i--) {
                const e = enemies[i];
                e.x += e.vx;
                e.y += e.vy;

                // 碰撞判定
                if(checkCollision(player,e)) {
                    gameOver = true;
                    cancelInterval(spawnTimer);
                    if(score > best) {
                        best = score;
                        localStorage.setItem('dodgeBest',best);
                        bestDom.innerText = best;
                    }
                    setTimeout(()=>{
                        alert(`游戏结束！\n本次得分：${score}\n最高分：${best}`);
                        restart();
                    },100);
                    return;
                }

                // 出界删除
                if(e.x < -50 || e.x > canvas.width+50 || e.y < -50 || e.y > canvas.height+50) {
                    enemies.splice(i,1);
                }
            }
        }

        // 游戏循环
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // 重启游戏
        function restart() {
            score = 0;
            speedRate = 1;
            gameOver = false;
            enemies = [];
            scoreDom.innerText = 0;
            initPlayer();
            startSpawn();
        }

        // 敌人生成计时器
        function startSpawn() {
            spawnTimer = setInterval(spawnEnemy, 380);
        }

        // 鼠标控制
        canvas.addEventListener('mousemove', e=>{
            if(gameOver) return;
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.y = e.clientY - rect.top;
        });

        // 触屏控制
        canvas.addEventListener('touchmove', e=>{
            e.preventDefault();
            if(gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            player.x = touch.clientX - rect.left;
            player.y = touch.clientY - rect.top;
        });

        // 初始化启动
        initPlayer();
        startSpawn();
        loop();
    </script>
</body>
</html>
