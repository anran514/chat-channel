<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端聊天室</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui}
        body {max-width: 700px; margin: 0 auto; padding: 15px; background:#1a1a2e}
        .online-tip {
            color:#4ade80;
            text-align:center;
            margin-bottom:12px;
            font-size:14px;
        }
        .nick-box {margin-bottom:15px; display:flex; gap:8px}
        #nickname {flex:1; padding:10px; border:1px solid #2a4a7a; border-radius:6px; font-size:16px; background:#16213e; color:#fff}
        #setNick {padding:0 16px; background:#e94560; color:#fff; border:none; border-radius:6px; cursor:pointer}
        .chat-box {height: 65vh; overflow-y:auto; background:#16213e; border-radius:8px; padding:15px; margin-bottom:15px}
        .msg-item {margin:8px 0; padding:10px; border-radius:7px; max-width:75%}
        .self {background:#e94560; color:#fff; margin-left:auto}
        .other {background:#1f3a5f; color:#e0e8f0}
        .name {font-size:13px; opacity:0.8; margin-bottom:4px}
        .send-area {display:flex; gap:8px}
        #msgInput {flex:1; padding:12px; border:1px solid #2a4a7a; border-radius:6px; font-size:16px; background:#16213e; color:#fff}
        #sendBtn {padding:0 20px; background:#e94560; color:#fff; border:none; border-radius:6px; cursor:pointer}
    </style>
</head>
<body>
    <!-- 新增在线人数展示区域 -->
    <div class="online-tip">当前在线：<span id="onlineNum">0</span> 人</div>

    <div class="nick-box">
        <input type="text" id="nickname" placeholder="输入你的昵称">
        <button id="setNick">确定昵称</button>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="send-area">
        <input type="text" id="msgInput" placeholder="输入消息，回车发送">
        <button id="sendBtn">发送</button>
    </div>

    <script>
        let userName = "";
        const API_BASE = "/api";
        const chatBox = document.getElementById('chatBox');
        const nickInput = document.getElementById('nickname');
        const setNickBtn = document.getElementById('setNick');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const onlineNumEl = document.getElementById('onlineNum');

        // 读取本地保存昵称
        if(localStorage.getItem('chatNick')){
            userName = localStorage.getItem('chatNick');
            nickInput.value = userName;
            loadMsg();
            updateUserActive();
            getOnlineCount();
        }

        // 设置昵称
        setNickBtn.onclick = () => {
            const tempName = nickInput.value.trim();
            if (!tempName) return alert("请填写昵称！");
            userName = tempName;
            localStorage.setItem('chatNick', userName);
            updateUserActive();
            loadMsg();
            getOnlineCount();
        }

        // 获取时分字符串
        function getTimeStr(){
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            return `${h}:${m}`;
        }

        // 更新在线状态
        async function updateUserActive(){
            if(!userName) return;
            try{
                await fetch(`${API_BASE}/user/list`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({name:userName, lastActive:Date.now()})
                })
            }catch(e){
                console.log("用户状态上报失败",e)
            }
        }

        // 【新增】获取在线人数（5分钟内活跃算在线）
        async function getOnlineCount(){
            try {
                const res = await fetch(`${API_BASE}/user/list`);
                const userList = await res.json();
                const now = Date.now();
                // 过滤5分钟内有操作的用户
                const online = userList.filter(u => now - u.lastActive < 5 * 60 * 1000);
                onlineNumEl.textContent = online.length;
            } catch (err) {
                onlineNumEl.textContent = "--";
            }
        }

        // 加载所有消息
        async function loadMsg(){
            try{
                const res = await fetch(`${API_BASE}/messages`);
                const list = await res.json();
                chatBox.innerHTML = "";
                list.forEach(item=>{
                    const div = document.createElement('div');
                    div.className = item.username === userName ? "msg-item self" : "msg-item other";
                    div.innerHTML = `<div class="name">${item.username}</div>${item.text}`;
                    chatBox.appendChild(div);
                })
                chatBox.scrollTop = chatBox.scrollHeight;
            }catch(e){
                chatBox.innerHTML = "<div style='color:#aaa'>加载消息失败，请等待接口部署完成</div>";
            }
        }

        // 发送消息
        async function sendMsg(){
            if(!userName) return alert("先输入并确定昵称！");
            const text = msgInput.value.trim();
            if(!text) return;
            try{
                await fetch(`${API_BASE}/messages`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        username:userName,
                        text:text,
                        time:getTimeStr(),
                        timestamp:Date.now()
                    })
                })
                msgInput.value = "";
                loadMsg();
                getOnlineCount(); // 发完刷新在线人数
            }catch(e){
                alert("发送失败，接口未就绪");
            }
        }

        // 点击发送按钮
        sendBtn.onclick = sendMsg;
        // 回车发送
        msgInput.addEventListener('keydown', (e)=>{
            if(e.key === 'Enter') sendMsg();
        })

        // 每3秒自动刷新消息+在线人数
        setInterval(()=>{
            if(userName){
                updateUserActive();
                loadMsg();
                getOnlineCount();
            }
        },3000)
    </script>
</body>
</html>
