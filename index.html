<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端聊天室</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui}
        body {max-width: 700px; margin: 0 auto; padding: 15px; background:#1a1a2e}
        .online-tip {
            color:#4ade80;
            text-align:center;
            margin-bottom:12px;
            font-size:14px;
        }
        .nick-box {margin-bottom:15px; display:flex; gap:8px}
        #nickname {flex:1; padding:10px; border:1px solid #2a4a7a; border-radius:6px; font-size:16px; background:#16213e; color:#fff}
        #setNick {padding:0 16px; background:#e94560; color:#fff; border:none; border-radius:6px; cursor:pointer}
        .chat-box {
            height: 65vh;
            overflow-y:auto;
            background:#16213e;
            border-radius:8px;
            padding:15px;
            margin-bottom:15px
        }
        .msg-item {margin:8px 0; padding:10px; border-radius:7px; max-width:75%}
        .self {background:#e94560; color:#fff; margin-left:auto}
        .other {background:#1f3a5f; color:#e0e8f0}
        .name {font-size:13px; opacity:0.8; margin-bottom:4px}
        .send-area {display:flex; gap:8px}
        #msgInput {flex:1; padding:12px; border:1px solid #2a4a7a; border-radius:6px; font-size:16px; background:#16213e; color:#fff}
        #sendBtn {padding:0 20px; background:#e94560; color:#fff; border:none; border-radius:6px; cursor:pointer}
    </style>
</head>
<body>
    <div class="online-tip">当前在线：<span id="onlineNum">0</span> 人</div>

    <div class="nick-box">
        <input type="text" id="nickname" placeholder="输入你的昵称">
        <button id="setNick">确定昵称</button>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="send-area">
        <input type="text" id="msgInput" placeholder="输入消息，回车发送">
        <button id="sendBtn">发送</button>
    </div>

    <script>
        let userName = "";
        const API_BASE = "/api";
        const chatBox = document.getElementById('chatBox');
        const nickInput = document.getElementById('nickname');
        const setNickBtn = document.getElementById('setNick');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const onlineNumEl = document.getElementById('onlineNum');

        let maxMsgTs = 0;
        let isScrollBottom = true;

        chatBox.addEventListener('scroll', () => {
            const scrollTop = chatBox.scrollTop;
            const height = chatBox.clientHeight;
            const totalHeight = chatBox.scrollHeight;
            isScrollBottom = (totalHeight - scrollTop - height) < 80;
        });

        if(localStorage.getItem('chatNick')){
            userName = localStorage.getItem('chatNick');
            nickInput.value = userName;
            loadMsgInit();
            updateUserActive();
            getOnlineCount();
        }

        setNickBtn.onclick = () => {
            const tempName = nickInput.value.trim();
            if (!tempName) return alert("请填写昵称！");
            userName = tempName;
            localStorage.setItem('chatNick', userName);
            updateUserActive();
            loadMsgInit();
            getOnlineCount();
        }

        function getTimeStr(){
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            return `${h}:${m}`;
        }

        async function updateUserActive(){
            if(!userName) return;
            try{
                await fetch(`${API_BASE}/user/list`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({name:userName, lastActive:Date.now()})
                })
            }catch(e){
                console.log("用户状态上报失败",e)
            }
        }

        async function getOnlineCount(){
            try {
                const res = await fetch(`${API_BASE}/user/list`);
                const allRecords = await res.json();
                const now = Date.now();
                const userMap = new Map();
                allRecords.forEach(item => {
                    const old = userMap.get(item.name) || 0;
                    if(item.lastActive > old){
                        userMap.set(item.name, item.lastActive);
                    }
                });
                let onlineCount = 0;
                userMap.forEach(time => {
                    if(now - time < 5 * 60 * 1000){
                        onlineCount++;
                    }
                })
                onlineNumEl.textContent = onlineCount;
            } catch (err) {
                onlineNumEl.textContent = "--";
            }
        }

        async function loadMsgInit(){
            try{
                const res = await fetch(`${API_BASE}/messages`);
                const list = await res.json();
                chatBox.innerHTML = "";
                maxMsgTs = 0;
                list.forEach(item=>{
                    renderSingleMsg(item);
                    if(item.timestamp > maxMsgTs) maxMsgTs = item.timestamp;
                })
                chatBox.scrollTop = chatBox.scrollHeight;
            }catch(e){
                chatBox.innerHTML = "<div style='color:#aaa'>加载消息失败，请等待接口部署完成</div>";
            }
        }

        async function loadMsgUpdate(){
            try{
                const res = await fetch(`${API_BASE}/messages`);
                const allList = await res.json();
                const newMsgs = allList.filter(m => m.timestamp > maxMsgTs);
                if(newMsgs.length === 0) return;
                newMsgs.forEach(item=>{
                    renderSingleMsg(item);
                    if(item.timestamp > maxMsgTs) maxMsgTs = item.timestamp;
                })
                if(isScrollBottom){
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }catch(e){
                console.log("增量刷新失败",e);
            }
        }

        function renderSingleMsg(item){
            const div = document.createElement('div');
            div.className = item.username === userName ? "msg-item self" : "msg-item other";
            div.innerHTML = `<div class="name">${escapeHtml(item.username)}</div>${item.text}`;
            chatBox.appendChild(div);
        }

        function escapeHtml(text){
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMsg(){
            if(!userName) return alert("先输入并确定昵称！");
            const text = msgInput.value.trim();
            if(!text) return;
            try{
                await fetch(`${API_BASE}/messages`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        username:userName,
                        text:text,
                        time:getTimeStr(),
                        timestamp:Date.now()
                    })
                })
                msgInput.value = "";
                await loadMsgUpdate();
                chatBox.scrollTop = chatBox.scrollHeight;
                getOnlineCount();
            }catch(e){
                alert("发送失败，接口未就绪");
            }
        }

        sendBtn.onclick = sendMsg;
        msgInput.addEventListener('keydown', (e)=>{
            if(e.key === 'Enter') sendMsg();
        })

        setInterval(()=>{
            if(userName){
                updateUserActive();
                loadMsgUpdate();
                getOnlineCount();
            }
        },3000)
    </script>
</body>
</html>
