<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端聊天室</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui}
        body {max-width: 700px; margin: 0 auto; padding: 15px; background:#f5f5f5}
        .nick-box {margin-bottom:15px; display:flex; gap:8px}
        #nickname {flex:1; padding:10px; border:1px solid #ddd; border-radius:6px; font-size:16px}
        #setNick {padding:0 16px; background:#0071e3; color:#fff; border:none; border-radius:6px; cursor:pointer}
        .chat-box {height: 65vh; overflow-y:auto; background:#fff; border-radius:8px; padding:15px; margin-bottom:15px}
        .msg-item {margin:8px 0; padding:10px; border-radius:7px; max-width:75%}
        .self {background:#0071e3; color:#fff; margin-left:auto}
        .other {background:#e9e9eb; color:#111}
        .name {font-size:13px; opacity:0.8; margin-bottom:4px}
        .send-area {display:flex; gap:8px}
        #msgInput {flex:1; padding:12px; border:1px solid #ddd; border-radius:6px; font-size:16px}
        #sendBtn {padding:0 20px; background:#0071e3; color:#fff; border:none; border-radius:6px; cursor:pointer}
    </style>
</head>
<body>
    <div class="nick-box">
        <input type="text" id="nickname" placeholder="输入你的昵称">
        <button id="setNick">确定</button>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="send-area">
        <input type="text" id="msgInput" placeholder="输入消息">
        <button id="sendBtn">发送</button>
    </div>

    <script>
        let userName = "";
        const chatBox = document.getElementById('chatBox');
        const nickInput = document.getElementById('nickname');
        const setNickBtn = document.getElementById('setNick');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        // 设置昵称
        setNickBtn.onclick = () => {
            userName = nickInput.value.trim();
            if (!userName) return alert("请填写昵称");
            localStorage.setItem('chatNick', userName);
            updateUserActive();
            loadMsg();
        }
        // 读取本地昵称
        if(localStorage.getItem('chatNick')){
            userName = localStorage.getItem('chatNick');
            nickInput.value = userName;
        }

        // 更新在线活跃时间
        async function updateUserActive(){
            await fetch('/functions/api/user/list',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({name:userName})
            })
        }

        // 加载消息列表
        async function loadMsg(){
            const res = await fetch('/functions/api/messages');
            const list = await res.json();
            chatBox.innerHTML = "";
            list.forEach(item=>{
                const div = document.createElement('div');
                div.className = item.username === userName ? "msg-item self" : "msg-item other";
                div.innerHTML = `<div class="name">${item.username}</div>${item.text}`;
                chatBox.appendChild(div);
            })
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 发送消息
        async function sendMsg(){
            if(!userName) return alert("先设置昵称");
            const text = msgInput.value.trim();
            if(!text) return;
            await fetch('/functions/api/messages',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({username:userName, text})
            })
            msgInput.value = "";
            loadMsg();
        }
        sendBtn.onclick = sendMsg;
        msgInput.onkeydown = e=>e.key==='Enter'&&sendMsg();

        // 自动刷新消息
        setInterval(()=>{
            if(userName){
                updateUserActive();
                loadMsg();
            }
        }, 3000)
    </script>
</body>
</html>
