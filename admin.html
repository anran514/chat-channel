<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室后台管理</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body {background:#0f0f1a;color:#e0e8f0;max-width:900px;margin:20px auto;padding:0 15px}
        h2 {margin-bottom:20px;color:#fff}
        .panel {background:#1a1a2e;padding:16px;border-radius:10px;border:1px solid #2a2a4a;margin-bottom:20px}
        .msg-item {padding:10px 0;border-bottom:1px solid #2a2a4a}
        .name {color:#63a8ff;font-weight:bold}
        .text {margin:4px 0}
        .time {font-size:12px;color:#99aacc}
        .btn {padding:8px 14px;background:#dc3545;color:#fff;border:none;border-radius:6px;margin-bottom:15px;cursor:pointer}
    </style>
</head>
<body>
    <h2>全部聊天记录</h2>
    <button class="btn" onclick="clearAllMsg()">清空所有消息</button>
    <div class="panel" id="msgList"></div>

    <script>
        const API_BASE = "/api";
        function escapeHtml(str) {
            let div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        async function loadRecords(){
            try{
                const res = await fetch(`${API_BASE}/messages`);
                const list = await res.json();
                let html = '';
                list.forEach(item=>{
                    html += `
                    <div class="msg-item">
                        <div class="name">${escapeHtml(item.username)}</div>
                        <div class="text">${escapeHtml(item.text)}</div>
                        <div class="time">${item.time} ${new Date(item.timestamp).toLocaleString()}</div>
                    </div>
                    `
                })
                document.getElementById('msgList').innerHTML = html || '<div>暂无聊天记录</div>';
            }catch(err){
                document.getElementById('msgList').innerHTML = '<div style="color:#aaa">加载失败</div>';
            }
        }
        async function clearAllMsg(){
            if(!confirm('确定清空全部消息，无法恢复？'))return;
            await fetch(`${API_BASE}/messages`,{method:'DELETE'});
            loadRecords();
        }
        loadRecords();
        setInterval(loadRecords, 4000);
    </script>
</body>
</html>
