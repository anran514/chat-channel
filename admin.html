<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室后台管理</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body {background:#0f0f1a;color:#e0e8f0;max-width:900px;margin:20px auto;padding:0 15px}
        h2 {margin-bottom:20px;color:#fff}
        .panel {background:#1a1a2e;padding:16px;border-radius:10px;border:1px solid #2a2a4a;margin-bottom:20px}
        .msg-item {padding:10px 0;border-bottom:1px solid #2a2a4a}
        .name {color:#60a5fa;font-weight:bold}
        .text {margin:4px 0}
        .time {font-size:12px;color:#8ba3c7}
        .btn {padding:8px 14px;background:#dc2626;color:#fff;border:none;border-radius:6px;margin-bottom:15px;cursor:pointer}
    </style>
</head>
<body>
    <h2>全部聊天记录</h2>
    <button class="btn" onclick="clearAllMsg()">清空所有消息</button>
    <div class="panel" id="msgList"></div>

    <script>
        const API_BASE = "/api";
        // 读取消息
        async function getRecord(){
            try{
                const res = await fetch(`${API_BASE}/messages`);
                const data = await res.json();
                let html = "";
                data.forEach(item=>{
                    html += `
                    <div class="msg-item">
                        <div class="name">${item.username}</div>
                        <div class="text">${item.text}</div>
                        <div class="time">${item.time} ${new Date(item.timestamp).toLocaleString()}</div>
                    </div>
                    `
                })
                document.getElementById('msgList').innerHTML = html || "<div>暂无消息</div>";
            }catch(e){
                document.getElementById('msgList').innerHTML = "<div style='color:#999'>接口加载失败</div>";
            }
        }
        // 清空消息
        async function clearAllMsg(){
            if(!confirm("确定清空全部消息？不可恢复")) return;
            await fetch(`${API_BASE}/messages`,{method:"DELETE"});
            getRecord();
        }
        getRecord();
        setInterval(getRecord,4000)
    </script>
</body>
</html>
