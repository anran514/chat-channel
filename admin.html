<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室后台</title>
    <style>
        body {max-width: 800px; margin: 20px auto; padding: 0 15px; font-family: system-ui}
        h2 {margin-bottom: 20px; color:#222}
        .card {background:#fff; padding:15px; border-radius:8px; box-shadow:0 1px 4px #ddd; margin-bottom:20px}
        .msg-item {padding:10px 0; border-bottom:1px solid #eee}
        .name {font-weight:bold; color:#0071e3}
        .time {font-size:12px; color:#777}
    </style>
</head>
<body>
    <h2>聊天室全部记录</h2>
    <div class="card" id="msgList"></div>

    <script>
        async function getRecord(){
            const res = await fetch('/functions/api/messages');
            const data = await res.json();
            let html = "";
            data.forEach(item=>{
                html += `
                <div class="msg-item">
                    <div class="name">${item.username}</div>
                    <div>${item.text}</div>
                    <div class="time">${new Date(item.timestamp).toLocaleString()}</div>
                </div>
                `
            })
            document.getElementById('msgList').innerHTML = html;
        }
        getRecord();
        setInterval(getRecord, 5000)
    </script>
</body>
</html>
